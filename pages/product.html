<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produk | Roster Cilegon</title>

    <link rel="icon" type="image/png" href="../assets/images/logo/Logo.png">

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/product.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>


    <!-- PRODUCT -->
    <main>

        <section class="product-section">

            <div class="product-header">

                <span class="product-label">
                    KOLEKSI ROSTER
                </span>

                <h1>
                    Pilihan Roster
                    <span>Roster Cilegon</span>
                </h1>

                <p>
                    Temukan berbagai pilihan motif roster untuk
                    mempercantik hunian, kantor, maupun bangunan Anda.
                </p>

            </div>


            <!-- FILTER -->
            <div class="product-filter">

                <button
                    class="filter-btn active"
                    data-category="all">
                    Semua
                </button>

                <button
                    class="filter-btn"
                    data-category="minimalis">
                    Minimalis
                </button>

                <button
                    class="filter-btn"
                    data-category="geometris">
                    Geometris
                </button>

                <button
                    class="filter-btn"
                    data-category="klasik">
                    Klasik
                </button>

            </div>


            <!-- PRODUK DARI JAVASCRIPT -->
            <div
                class="product-grid"
                id="productGrid">
            </div>


        </section>

    </main>

     <!-- =========================
     FOOTER
=   ========================= -->

<footer class="footer">

    <div class="container">

        <p>
            © 2026 <strong>FrameStudioCode</strong>.
            All Rights Reserved.
        </p>

    </div>

</footer>


    <!-- JAVASCRIPT -->
    <script src="../js/navbar.js"></script>
    <script src="../js/product.js"></script>

</body>

</html>
